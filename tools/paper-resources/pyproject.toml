[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "paper-resources"
version = "0.1.0"
description = "Populate external source and reference resources for Paper Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
dependencies = [
    "anyio>=4.0.0,<5.0.0",
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
]

[project.scripts]
paper-resources = "paper_resources.cli:main"
paper-resources-mcp = "paper_resources.mcp_server:main"
